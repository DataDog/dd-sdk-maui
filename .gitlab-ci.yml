stages:
  - build
  - verify
  - test

variables:
  DEVELOP_BRANCH: 'develop'

default:
  tags:
    - macos:sequoia-arm64
    - specific:true

# ============================================================================
# BUILD: Compile all native wrappers, bindings, and NuGet packages
# ============================================================================
build:sdk:
  stage: build
  timeout: 30m
  script:
    - ./build.sh
  artifacts:
    paths:
      - local-packages/
    expire_in: 1 day

# ============================================================================
# VERIFY: Validate build artifacts and linting (NuGet structure, ProGuard rules)
# ============================================================================
verify:artifacts:
  stage: verify
  needs: [build:sdk]
  timeout: 5m
  script:
    - ./verify-artifacts.sh

verify:lint:
  stage: verify
  needs: [build:sdk]
  timeout: 5m
  script:
    - dotnet format --verify-no-changes

# ============================================================================
# TESTS: Run unit tests for each platform independently
# ============================================================================
test:maui:
  stage: test
  needs: [build:sdk]
  timeout: 15m
  script:
    - ./check.sh --maui

test:ios:
  stage: test
  needs: [build:sdk]
  timeout: 15m
  script:
    - ./check.sh --ios

test:android:
  stage: test
  needs: [build:sdk]
  timeout: 15m
  script:
    - ./check.sh --android

# ============================================================================
# EXAMPLE APPS: Verify example apps build with the SDK packages
# ============================================================================
build:example-ios:
  stage: test
  needs: [build:sdk]
  timeout: 15m
  script:
    - cd example
    - ./build.sh --ios

build:example-android:
  stage: test
  needs: [build:sdk]
  timeout: 15m
  script:
    - cd example
    - ./build.sh --android

build:example-ios-net9:
  stage: test
  needs: [build:sdk]
  timeout: 15m
  script:
    - cd example
    - ./build.sh --ios --net9

build:example-android-net9:
  stage: test
  needs: [build:sdk]
  timeout: 15m
  script:
    - cd example
    - ./build.sh --android --net9

# ============================================================================
# .NET 9 TESTS: Run C# unit tests against .NET 9
# ============================================================================
test:maui-net9:
  stage: test
  needs: [build:sdk]
  timeout: 15m
  script:
    - ./check.sh --maui --net9