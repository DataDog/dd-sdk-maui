
name: Publish to NuGet
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no packages will be pushed)'
        type: boolean
        default: true

jobs:
  publish:
    name: Publish SDK packages
    runs-on: macos-latest
    environment: Production

    permissions:
      contents: read
      id-token: write 

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5
        with:
          dotnet-version: |
            9.x
            10.x

      - name: Install MAUI workloads
        run: dotnet workload install maui --skip-manifest-update


      - name: Install datadog-ci
        run: npm install -g @datadog/datadog-ci@5.18.0

      - name: Prepare release packages
        run: ./prepare-release.sh

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: nuget-packages
          path: local-packages/*.nupkg

      - name: NuGet login (OIDC → temp API key)
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
        run: ./publish.sh ${{ inputs.dry_run && '--dry-run' || '' }}
