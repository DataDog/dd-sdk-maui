
name: Publish to NuGet
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no packages will be pushed)'
        type: boolean
        default: true

jobs:
  publish:
    name: Publish SDK packages
    runs-on: macos-latest
    environment: Production

    permissions:
      contents: read
      id-token: write 

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: |
            9.x
            10.x

      - name: Install MAUI workloads
        run: |
          dotnet workload install maui-android maui-ios --sdk-version 9.0
          dotnet workload install maui-android maui-ios --sdk-version 10.0

      - name: Install datadog-ci
        run: npm install -g @datadog/datadog-ci@5.18.0

      - name: Prepare release packages
        run: ./prepare-release.sh --skip-tests

      - name: NuGet login (OIDC → temp API key)
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
        run: ./publish.sh ${{ inputs.dry_run && '--dry-run' || '' }}
