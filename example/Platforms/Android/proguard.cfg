# JavaThrower is only reached from C# by name (JNIEnv.FindClass in NativeCrashHelper.cs),
# which R8 can't see, so without this it is removed or renamed in Release builds.
# The trailing * also keeps JavaThrower$1, the Runnable that throws on the Java thread.
-keep class com.datadog.mauiexample.crash.JavaThrower* { *; }

# Keep file/line info so the crash's Java frames read JavaThrower.java:NN.
-keepattributes SourceFile,LineNumberTable
